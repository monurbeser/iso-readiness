<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISO 9001:2026 Readiness Check | Bimser QDMS</title>
<meta name="description" content="Free self-assessment with a GAP analysis against ISO 9001:2026: processes to revise, digitalization points and the QDMS modules that close each gap. PDF report in English or Turkish.">
<meta property="og:title" content="ISO 9001:2026 Readiness Check and GAP Analysis">
<meta property="og:description" content="25 questions, about 8 minutes: get a clause-by-clause GAP analysis and a QDMS module roadmap as a PDF.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concept: a consulting diagnostic. Wine gradient band carries the page title; content sits on paper sheets
   laid on a blush ground. Signature elements: the 36-month transition strip, the maturity ladder, the 2x2 matrix. */
:root{
  --ground:#F7F1F3; --ground-2:#EFE3E7; --paper:#FFFFFF; --ink:#26161C; --ink-2:#5F4951; --ink-3:#86707A;
  --rule:#E7D8DE; --wine:#7D2142; --wine-deep:#541029; --rose:#B65A76; --blush:#F5E4EA; --blush-2:#EBCBD6;
  --gold:#9C7438;
  --st0-bg:#F3D3DC; --st0:#7D2142; --st1-bg:#FBEBD9; --st1:#80520E; --st2-bg:#DDEFE7; --st2:#2B6553;
  --band:linear-gradient(118deg,#5C1430 0%,#7D2142 38%,#A2466A 78%,#C27791 100%);
  --btn:linear-gradient(135deg,#8A2A4C 0%,#6A1835 100%);
  --on-band:#FFF6F8; --on-band-2:#F2D3DD;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --shadow:0 1px 2px rgba(84,16,41,.06),0 12px 32px -18px rgba(84,16,41,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#170D11; --ground-2:#1F1217; --paper:#22141A; --ink:#F4E9ED; --ink-2:#CDB3BC; --ink-3:#A08891;
  --rule:#3B2630; --wine:#E08BA6; --wine-deep:#F2B8CA; --rose:#C9718E; --blush:#3A1D28; --blush-2:#55293A; --gold:#D5AF73;
  --st0-bg:#4A1F2C; --st0:#F3B5C8; --st1-bg:#45331A; --st1:#F0C982; --st2-bg:#1D3A31; --st2:#8FD6B9;
  --band:linear-gradient(118deg,#3A0A1B 0%,#5A1530 45%,#7E2D4C 100%); --btn:linear-gradient(135deg,#B04A6E 0%,#8A2A4C 100%);
  --on-band:#FFF2F6; --on-band-2:#E9C3D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#170D11; --ground-2:#1F1217; --paper:#22141A; --ink:#F4E9ED; --ink-2:#CDB3BC; --ink-3:#A08891;
  --rule:#3B2630; --wine:#E08BA6; --wine-deep:#F2B8CA; --rose:#C9718E; --blush:#3A1D28; --blush-2:#55293A; --gold:#D5AF73;
  --st0-bg:#4A1F2C; --st0:#F3B5C8; --st1-bg:#45331A; --st1:#F0C982; --st2-bg:#1D3A31; --st2:#8FD6B9;
  --band:linear-gradient(118deg,#3A0A1B 0%,#5A1530 45%,#7E2D4C 100%); --btn:linear-gradient(135deg,#B04A6E 0%,#8A2A4C 100%);
  --on-band:#FFF2F6; --on-band-2:#E9C3D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -18px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--ground-2) 0,var(--ground) 520px) var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:18px;font-weight:600;line-height:1.35}
a{color:var(--wine)}
button{font:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}

.band{background:var(--band);color:var(--on-band);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 88% -10%,rgba(255,255,255,.22),transparent 60%),radial-gradient(40% 80% at 0% 110%,rgba(40,0,15,.35),transparent 70%);pointer-events:none}
.band-in{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-inline:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:17px;color:var(--on-band)}
.wordmark span{font-weight:500;color:var(--on-band-2);font-size:15px}
.topright{display:flex;align-items:center;gap:16px}
.topbar .meta{font-size:14px;color:var(--on-band-2)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:end;padding-block:40px 56px}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;color:var(--on-band)}
.hero p.lead{font-size:19px;line-height:1.55;color:var(--on-band-2);max-width:50ch;margin-top:20px}
.hero .cta-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:32px}
.hero .fine{font-size:14px;color:var(--on-band-2)}
.band.slim .hero{display:block;padding-block:8px 36px}
.band.slim .hero h1{font-size:clamp(26px,3.4vw,36px)}

.clock{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:22px 22px 18px}
.clock-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.clock-head b{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600}
.clock-head span{font-size:14px;color:var(--on-band-2);text-align:right}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:18px}
.months i{display:block;aspect-ratio:1.6;border-radius:3px;background:rgba(255,255,255,.18)}
.months i.past{background:rgba(255,255,255,.85)}
.months i.end{background:#F6C9A0}
.clock-scale{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--on-band-2);margin-top:10px}

.page{max-width:1120px;margin:0 auto;padding-inline:24px;padding-block:0 64px}
.lift{margin-top:-28px;position:relative;z-index:2}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:36px;min-width:0}
.btn{appearance:none;border:0;background:var(--btn);color:#fff;font-weight:600;font-size:16px;padding:14px 26px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px -8px rgba(84,16,41,.6);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(84,16,41,.7)}
.btn.light{background:#fff;color:#6A1835;box-shadow:0 8px 20px -10px rgba(30,0,10,.6)}
.btn.quiet{background:transparent;color:var(--wine);box-shadow:none;border:1px solid var(--blush-2)}
.btn.quiet:hover{background:var(--blush)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.gets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.gets div{border-top:2px solid var(--wine);padding-top:16px}
.gets p{color:var(--ink-2);font-size:16px;margin-top:6px}

.assess{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:2px;padding:0;margin:0;list-style:none}
.rail li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:15px;color:var(--ink-3)}
.rail li .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--blush-2);display:grid;place-items:center;font-size:12px;font-weight:700}
.rail li.done{color:var(--ink-2)}
.rail li.done .dot{background:var(--blush);border-color:var(--rose);color:var(--wine)}
.rail li.now{background:var(--blush);color:var(--ink);font-weight:600}
.rail li.now .dot{background:var(--btn);border-color:transparent;color:#fff}
.mob-progress{display:none}
.qhead{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.qhead .clause{font-size:14px;color:var(--wine);font-weight:600}
.qhead h2{font-size:32px;line-height:1.15}
.qhead p{color:var(--ink-2)}
.qlist{display:flex;flex-direction:column}
fieldset.q{border:0;margin:0;padding:24px 0;border-top:1px solid var(--rule);min-width:0}
fieldset.q:first-child{border-top:0;padding-top:0}
fieldset.q legend{float:left;width:100%;padding:0 0 16px;font-size:18px;font-weight:500;line-height:1.45;max-width:62ch}
fieldset.q .ladder{clear:both}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--blush-2);border-radius:12px;overflow:hidden}
.rung{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px;border-left:1px solid var(--blush-2);font-size:14px;line-height:1.3;color:var(--ink-2);background:var(--paper);transition:background .15s,color .15s;min-height:84px}
.rung:first-child{border-left:0}
.rung input{position:absolute;opacity:0;pointer-events:none}
.rung .lvl{display:flex;gap:3px}
.rung .lvl i{width:10px;height:4px;border-radius:2px;background:var(--blush-2)}
.rung:hover{background:var(--blush)}
.rung.fill{background:var(--blush);color:var(--ink)}
.rung.fill .lvl i{background:var(--rose)}
.rung.sel{background:var(--btn);color:#fff}
.rung.sel .lvl i{background:rgba(255,255,255,.85)}
.rung:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:-3px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--rule)}
.navrow .count{font-size:14px;color:var(--ink-3)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.field{display:flex;flex-direction:column;gap:7px;font-size:15px;font-weight:600;color:var(--ink-2);min-width:0}
.field.full{grid-column:1 / -1}
input[type=text],input[type=email],input[type=tel],select{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--blush-2);border-radius:10px;padding:12px 14px;width:100%}
input:focus,select:focus{border-color:var(--wine);outline:none;box-shadow:0 0 0 3px var(--blush)}
.check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:15px;color:var(--ink-2);align-items:start}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--wine)}
.err{color:var(--st0);font-size:14px;min-height:1.2em}

/* report */
.pdfbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--blush-2);border-left:5px solid var(--wine);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow)}
.pdfbar p{font-weight:600}
.pdfbar span{display:block;font-weight:400;font-size:14px;color:var(--ink-3)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:28px;padding-top:24px;border-top:1px solid var(--rule)}
.summary b{display:block;font-family:var(--serif);font-size:34px;line-height:1;color:var(--wine);font-weight:600}
.summary span{font-size:14px;color:var(--ink-2)}
.exhibits{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start}
.exhibit{display:flex;flex-direction:column;gap:14px;min-width:0}
.ex-label{font-size:14px;color:var(--ink-3)}
.ex-label b{color:var(--wine);font-weight:600}
.sheet > .ex-label{margin-bottom:16px}
.matrix{width:100%;height:auto;display:block}
.matrix text{font-family:var(--sans)}
.scores{display:flex;gap:28px;flex-wrap:wrap}
.score b{display:block;font-family:var(--serif);font-size:48px;line-height:1;font-weight:600;color:var(--wine)}
.score span{font-size:14px;color:var(--ink-2)}
.verdict{background:var(--blush);border-radius:12px;padding:18px 20px}
.verdict h3{font-family:var(--serif);font-size:21px;color:var(--wine-deep)}
.verdict p{color:var(--ink-2);margin-top:6px;font-size:16px}
.hv{width:100%;border-collapse:collapse;font-size:15px}
.hv td{padding:11px 0;border-top:1px solid var(--rule);vertical-align:middle}
.hv tr:first-child td{border-top:0}
.hv td.ball{width:40px}
.hv td.val{text-align:right;width:56px;font-weight:600;color:var(--ink-2)}
.hv .cl{display:block;font-size:13px;color:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.data{width:100%;border-collapse:collapse;font-size:15px;min-width:720px}
table.data th{text-align:left;font-size:13px;font-weight:600;color:var(--ink-3);padding:0 12px 10px 0;border-bottom:2px solid var(--wine);vertical-align:bottom}
table.data td{padding:14px 12px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.data td.cl{font-weight:600;color:var(--wine);white-space:nowrap}
table.data td.sc{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;padding-right:20px}
table.data .sub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.st{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st0{background:var(--st0-bg);color:var(--st0)}.st1{background:var(--st1-bg);color:var(--st1)}.st2{background:var(--st2-bg);color:var(--st2)}
.kind{display:inline-block;font-size:12px;font-weight:600;color:var(--wine);border:1px solid var(--blush-2);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.rm th.c{text-align:center;padding-right:0;font-size:12px;white-space:nowrap}
.rm td.c{text-align:center;padding-right:0;vertical-align:middle;border-left:1px solid var(--rule)}
.rm th.c{border-left:1px solid var(--rule)}
table.data.rm td{vertical-align:middle}
.rm .sub{max-width:44ch;line-height:1.45}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--wine)}
.pbar{display:block;height:8px;background:var(--blush);border-radius:999px;overflow:hidden;min-width:56px}
.pbar i{display:block;height:100%;background:var(--btn);border-radius:999px}
.note{font-size:14px;color:var(--ink-3)}
.phases{display:flex;flex-direction:column;gap:28px}
.phase h3{font-family:var(--serif);font-size:21px;color:var(--wine-deep);margin-bottom:6px}
.mod{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,.9fr);gap:20px;padding:14px 0;border-top:1px solid var(--rule);font-size:15px}
.mod b{font-weight:600}
.mod p{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:start}
.chips span{font-size:13px;font-weight:600;color:var(--wine);background:var(--blush);border-radius:6px;padding:3px 8px}
.gantt{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.gantt .m{font-size:12px;color:var(--ink-3);text-align:center}
.gantt .bar{border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.4;color:var(--ink)}
.gantt .b1{grid-column:1 / span 3;background:var(--blush-2)}
.gantt .b2{grid-column:4 / span 3;background:var(--blush)}
.gantt .b3{grid-column:7 / span 3;background:var(--btn);color:#fff}
.gantt .bar b{display:block;font-size:13px;margin-bottom:2px}
.cta-band{background:var(--band);color:var(--on-band);border-radius:16px;padding:40px;display:grid;grid-template-columns:minmax(0,1.3fr) auto;gap:28px;align-items:center}
.cta-band h2{font-size:30px;line-height:1.15;color:var(--on-band)}
.cta-band p{color:var(--on-band-2);margin-top:10px;max-width:52ch}
.cta-band .acts{display:flex;flex-direction:column;gap:12px}
.cta-band .btn.ghostlight{background:transparent;color:var(--on-band);border:1px solid rgba(255,255,255,.45);box-shadow:none}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.share input{font-size:14px;color:var(--ink-2)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-xl{display:flex;flex-direction:column;gap:28px}
.notice{background:var(--blush);color:var(--ink-2);border-radius:10px;padding:12px 16px;font-size:15px}
footer.foot{max-width:1120px;margin:0 auto;padding:0 24px 48px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:360px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-size:15px;text-align:center;box-shadow:var(--shadow)}

@media (max-width:900px){
  .hero,.exhibits,.cta-band,.share{grid-template-columns:minmax(0,1fr)}
  .hero{gap:32px}
  .assess{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mob-progress{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
  .mob-progress .track{height:4px;background:var(--blush);border-radius:2px;overflow:hidden}
  .mob-progress .track i{display:block;height:100%;background:var(--btn)}
  .mob-progress span{font-size:14px;color:var(--ink-3)}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mod{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (max-width:640px){
  body{font-size:16px}
  .sheet{padding:22px}
  .band-in,.page{padding-inline:16px}
  .wordmark span,.topbar .meta{display:none}
  .gets,.fields{grid-template-columns:minmax(0,1fr)}
  .ladder{grid-template-columns:minmax(0,1fr)}
  .rung{border-left:0;border-top:1px solid var(--blush-2);min-height:0;flex-direction:row;align-items:center;gap:12px;padding:12px 14px}
  .rung:first-child{border-top:0}
  .gantt{grid-template-columns:minmax(0,1fr)}
  .gantt .m{display:none}
  .gantt .b1,.gantt .b2,.gantt .b3{grid-column:1}
  .cta-band{padding:28px}
  .qhead h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .sheet{box-shadow:none;break-inside:avoid}
  .band,.cta-band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="root"></div>
<footer class="foot"><p id="fDisc"></p><p id="fIso"></p></footer>
<div class="toast" id="toast" hidden></div>
<script>
/* ===================== CONFIG — edit before going live =====================
   reportEndpoint: serverless function that emails the report (Vercel: /api/send-report, Netlify: same path)
                   set to "" to disable emailing (the form then shows a preview message)
   bookingUrl / privacyUrl / starterUrl: Bimser pages for the call to action and consent
   shareUrl: permanent public URL of this page, used in share and invite links
   turnstileSiteKey: optional Cloudflare Turnstile site key (bot protection for the email form)
   pdfLib: pdfmake build files, self-hosted under /vendor */
const CONFIG = {
  reportEndpoint: "/api/send-report",
  bookingUrl: "https://bimser.com/en/",
  privacyUrl: "https://bimser.com/en/",
  starterUrl: "https://bimser.com/en/products/qdms/",
  shareUrl: "",
  turnstileSiteKey: "",
  transitionDeadline: "2029-09-30",
  autoDownloadPdf: true,
  pdfLib: ["/vendor/pdfmake.min.js", "/vendor/vfs_fonts.js"],
  hotRule: { maxReadiness: 60, minEmployees: 200, tier1: ["AE","SA","QA","OM","AZ","KZ","EG","ZA"] }
};

const SCALE_A = {
 "en": [
  "Not in place",
  "Informal / ad hoc",
  "Defined, partly applied",
  "Applied and tracked",
  "Applied, measured and improved"
 ]
};
const SCALE_B = {
 "en": [
  "Paper",
  "Excel and email",
  "Shared folders / intranet",
  "Partly in a software system",
  "Integrated QMS software"
 ]
};
const MODULES = {
 "DOC": {
  "name": {
   "en": "Controlled Document Management"

/* ===================== SCORING ===================== */
const avgPct = ids => { const v = ids.map(id => state.answers[id]).filter(x => x !== undefined); return v.length ? Math.round(v.reduce((s,x)=>s+x,0) / (v.length*4) * 100) : 0; };
function scoreAll(){
  const ar = {}; AREAS.forEach(a => { ar[a.id] = avgPct(QUESTIONS.filter(q => q.area === a.id).map(q => q.id)); });
  const wsum = AREAS.reduce((s,a)=>s+a.weight,0);
  const readiness = Math.round(AREAS.reduce((s,a)=>s+ar[a.id]*a.weight,0) / wsum);
  const digital = avgPct(DIGITAL.map(d => d.id));
  const quad = (readiness >= 60 ? "r" : "m") + (digital >= 60 ? "r" : "m");
  return { area: ar, readiness, digital, quad };
}
function gapAnalysis(){
  const rows = GAP_ROWS.map(r => { const score = avgPct(r.q); return { ...r, score, level: score < 40 ? 0 : score < 70 ? 1 : 2 }; });
  const dig = DIGITAL.map(d => { const l = state.answers[d.id] ?? 0; return { ...d, tool: l, need: l <= 1 ? 0 : l === 2 ? 1 : 2 }; });
  const w = {}, cl = {};
  const add = (m, weight, clause) => { w[m] = (w[m] || 0) + weight; (cl[m] = cl[m] || new Set()).add(clause); };
  const boost = { new: 1.3, changed: 1.15, deadline: 1, same: 1 };
  rows.filter(r => r.level < 2).forEach(r => r.mods.forEach((m, i) => add(m, (100 - r.score) * (i === 0 ? 1.5 : 0.5) * boost[r.kind], r.clause)));
  dig.filter(d => d.need < 2).forEach(d => d.mods.forEach((m, i) => add(m, (4 - d.tool) * 25 * (i === 0 ? 1 : 0.6), d.clause)));
  const ranked = Object.keys(w).sort((a,b) => w[b] - w[a]);
  let mods = ranked.slice(0, 10).map(id => ({ id, weight: w[id], clauses: [...cl[id]] }));
  const more = ranked.slice(10);
  if (!mods.length) mods = [{ id: "AUDIT", weight: 1, clauses: ["T"] }];
  return { rows, dig, mods, more, major: rows.filter(r => r.level === 0).length, partial: rows.filter(r => r.level === 1).length, digNeed: dig.filter(d => d.need < 2).length };
}
function clauseKey(c){ return c === "T" ? [99] : c.split(".").map(Number); }
function roadmap(g){
  const split = m => [...new Set(m.clauses.flatMap(c => c.split(" · ")))];
  const cols = [...new Set(g.mods.flatMap(split))].sort((a, b) => { const x = clauseKey(a), y = clauseKey(b); for (let i = 0; i < 3; i++) { const d = (x[i] ?? -1) - (y[i] ?? -1); if (d) return d; } return 0; });
  const max = Math.max(...g.mods.map(m => m.weight), 1);
  return { cols, rows: g.mods.map(m => ({ id: m.id, pct: Math.max(0.12, m.weight / max), has: new Set(split(m)) })) };
}
const colLabel = c => c === "T" ? T("transShort") : c;
function monthsLeft(){ const d = new Date(CONFIG.transitionDeadline + "T00:00:00"), n = new Date(); return Math.max(0, (d.getFullYear()-n.getFullYear())*12 + (d.getMonth()-n.getMonth())); }
function leadTemperature(sc, country){
  const r = CONFIG.hotRule, emp = OPTS.sizeMin[Number(state.profile.size)] ?? 0;
  if (sc.readiness < r.maxReadiness && emp >= r.minEmployees && r.tier1.includes(country)) return "hot";
  if (sc.readiness < 75 && emp >= 50) return "warm";
  return "cold";
}

function harvey(score, c){
  c = c || { line: "var(--wine)", fill: "var(--wine)", bg: "var(--paper)" };
  const q = Math.round(score / 25), r = 9, cx = 11, cy = 11; let wedge = "";

  return `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" role="img" aria-label="${score}/100"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${c.bg}" stroke="${c.line}" stroke-width="1.5"/>${wedge}</svg>`;

    <section class="sheet"><p class="ex-label"><b>${esc(T("ex"))} 5</b> ${esc(T("ex5"))}</p><div class="tablewrap"><table class="data"><thead><tr><th style="width:32%">${esc(T("thProcess"))}</th><th style="width:22%">${esc(T("thToday"))}</th><th style="width:16%">${esc(T("thNeed"))}</th><th>${esc(T("thModule"))}</th></tr></thead><tbody>${digRows}</tbody></table></div></section>
    <section class="sheet"><p class="ex-label"><b>${esc(T("ex"))} 6</b> ${esc(T("ex6"))}</p>${rmTable}${g.more.length ? `<p style="margin-top:20px;color:var(--ink-2);font-size:15px"><b>${esc(T("moreMods"))}:</b> ${g.more.map(m => esc(L(MODULES[m].name))).join(", ")}</p>` : ""}</section>
    <section class="cta-band"><div><h2>${esc(T("ctaTitle"))}</h2><p>${esc(T("ctaLead"))}</p></div><div class="acts noprint" style="flex-direction:column"><a class="btn light" href="${esc(CONFIG.bookingUrl)}" target="_blank" rel="noopener">${esc(T("book"))}</a><a class="btn ghostlight" href="${esc(CONFIG.starterUrl)}" target="_blank" rel="noopener">${esc(T("starter"))}</a></div></section>
    <section class="sheet stack noprint" id="mailSection"><div><h2 style="font-size:24px">${esc(T("emailTitle"))}</h2><p style="color:var(--ink-2);margin-top:6px">${esc(T("emailLead"))}</p></div>
      <form id="leadForm" class="stack" novalidate><div class="fields">
        <label class="field" for="fName">${esc(T("name"))}<input type="text" id="fName" autocomplete="name" maxlength="120" value="${esc(f.fullName)}"></label>
        <label class="field" for="fEmail">${esc(T("email"))}<input type="email" id="fEmail" autocomplete="email" maxlength="160" value="${esc(f.email)}"></label>
        <label class="field" for="fCompany">${esc(T("company").split(" (")[0])}<input type="text" id="fCompany" autocomplete="organization" maxlength="160" value="${esc(f.company || p.company)}"></label>
        <label class="field" for="fTitle">${esc(T("title"))}<input type="text" id="fTitle" autocomplete="organization-title" maxlength="120" value="${esc(f.jobTitle)}"></label>
        <label class="field" for="fCountry">${esc(T("country"))}<select id="fCountry"><option value="">${esc(T("choose"))}</option>${COUNTRIES.map(c => `<option value="${c[0]}" ${f.country === c[0] ? "selected" : ""}>${esc(c[1])}</option>`).join("")}</select></label>
        <label class="field" for="fPhone">${esc(T("phone"))}<input type="tel" id="fPhone" autocomplete="tel" maxlength="40" value="${esc(f.phone)}"></label></div>
        <div class="hp" aria-hidden="true"><label for="fWebsite">Website</label><input type="text" id="fWebsite" tabindex="-1" autocomplete="off"></div>
        <label class="check" for="fContact"><input type="checkbox" id="fContact" ${f.wantContact ? "checked" : ""}><span>${esc(T("wantContact"))}</span></label>
        <label class="check" for="fConsent"><input type="checkbox" id="fConsent"><span>${esc(T("consent"))} <a href="${esc(CONFIG.privacyUrl)}" target="_blank" rel="noopener">${esc(T("privacy"))}</a></span></label>
        <label class="check" for="fMkt"><input type="checkbox" id="fMkt"><span>${esc(T("marketing"))}</span></label>
        ${CONFIG.turnstileSiteKey ? '<div id="tsBox"></div>' : ""}
        <p class="err" id="formErr" role="alert">${esc(state.leadNotice)}</p><div><button type="submit" class="btn" id="submitBtn">${esc(T("sendReport"))}</button></div></form></section>
    <section class="sheet stack noprint"><div><h2 style="font-size:24px">${esc(T("shareTitle"))}</h2><p style="color:var(--ink-2);margin-top:6px">${esc(T("shareLead"))}</p></div>
      <div class="share"><input type="text" id="shareField" readonly value="${esc(share)}" aria-label="${esc(T("copy"))}"><div class="acts"><button type="button" class="btn" id="copyBtn">${esc(T("copy"))}</button><a class="btn quiet" href="${esc(li)}" target="_blank" rel="noopener">${esc(T("linkedin"))}</a><button type="button" class="btn quiet" id="restart">${esc(T("restart"))}</button></div></div></section>
  </main>`;
  document.getElementById("pdfBtn").onclick = () => makePdf(false);
  document.getElementById("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(share); toast(T("copied")); } catch (e) { const x = document.getElementById("shareField"); x.focus(); x.select(); toast(T("copyFail")); } };
  document.getElementById("restart").onclick = () => { Object.assign(state, { answers: {}, leadDraft: null, leadNotice: "", pdfDone: false, profile: { company: "", industry: "", size: "", cert: "" } }); go("intro"); };
  document.getElementById("leadForm").onsubmit = onLead;
  if (CONFIG.turnstileSiteKey) mountTurnstile();
  if (!state.pdfDone && CONFIG.autoDownloadPdf) makePdf(true); else setPdfMsg(state.pdfDone ? T("pdfDownloaded") : T("pdfReady"));
}
function setPdfMsg(m){ const el = document.getElementById("pdfMsg"); if (el) el.innerHTML = `${esc(m)}<span>${esc(T("pdfFormat"))}</span>`; }

/* ===================== EMAIL THE REPORT ===================== */
let tsWidget = null;
function mountTurnstile(){
  const go = () => { try { tsWidget = window.turnstile.render("#tsBox", { sitekey: CONFIG.turnstileSiteKey }); } catch (e) {} };
  if (window.turnstile) return go();
  const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"; s.async = true; s.onload = go; document.head.appendChild(s);
}
function pdfBase64(){ return loadPdfLib().then(() => new Promise((res, rej) => { try { window.pdfMake.createPdf(buildDoc()).getBase64(res); } catch (e) { rej(e); } })); }
function reportSummary(sc, g){
  const [vh, vb] = T("quad")[sc.quad];
  return { company: state.profile.company, readiness: sc.readiness, digital: sc.digital, verdict: vh, verdictText: vb, monthsLeft: monthsLeft(),
    gaps: g.rows.filter(r => r.level < 2).sort((a, b) => a.score - b.score).slice(0, 6).map(r => ({ clause: clauseTxt(r.clause), topic: L(r.topic), level: T("gap")[r.level], score: r.score })),
    modules: g.mods.slice(0, 6).map(m => L(MODULES[m.id].name)) };
}
async function onLead(e){
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const lead = { fullName: v("fName"), email: v("fEmail"), company: v("fCompany"), jobTitle: v("fTitle"), country: v("fCountry"), phone: v("fPhone"),
    consent: document.getElementById("fConsent").checked, marketingOptIn: document.getElementById("fMkt").checked, wantContact: document.getElementById("fContact").checked };
  state.leadDraft = lead; const err = document.getElementById("formErr"), btn = document.getElementById("submitBtn");
  err.style.color = "";
  if (!lead.fullName || !lead.email || !lead.company || !lead.jobTitle || !lead.country) { err.textContent = T("errReq"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(lead.email)) { err.textContent = T("errEmail"); return; }
  if (!lead.consent) { err.textContent = T("errConsent"); return; }
  if (!CONFIG.reportEndpoint) { err.style.color = "var(--st1)"; err.textContent = T("mailPreview"); return; }
  btn.disabled = true; err.textContent = T("sending");
  const sc = scoreAll(), g = gapAnalysis();
  try {
    const pdf = await pdfBase64();
    const payload = { submittedAt: new Date().toISOString(), startedAt: state.startedAt, lang: "en", lead, website: v("fWebsite"),
      turnstileToken: tsWidget !== null && window.turnstile ? window.turnstile.getResponse(tsWidget) : "",
      profile: { company: state.profile.company, industry: OPTS.industry.en[state.profile.industry], employees: OPTS.size.en[state.profile.size], certification: OPTS.cert.en[state.profile.cert] },
      scores: { readiness: sc.readiness, digital: sc.digital, quadrant: sc.quad, areas: sc.area },
      gap: { major: g.rows.filter(r => r.level === 0).map(r => r.id), partial: g.rows.filter(r => r.level === 1).map(r => r.id), modules: g.mods.map(m => m.id) },
      summary: reportSummary(sc, g), temperature: leadTemperature(sc, lead.country), answers: state.answers, tracking,
      page: location.href.split("#")[0].slice(0, 300), pdfName: pdfName(), pdfBase64: pdf };
    const r = await fetch(CONFIG.reportEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) throw Object.assign(new Error("limit"), { code: "limit" });
    if (r.status === 403 && j.error === "bot_check") throw Object.assign(new Error("bot"), { code: "bot" });
    if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
    err.style.color = "var(--st2)"; err.textContent = j.preview ? T("mailPreview") : T("mailOk");
  } catch (x) {
    console.warn("[ISO26] email", x);
    err.style.color = ""; err.textContent = x.code === "limit" ? T("mailLimit") : x.code === "bot" ? T("mailBot") : T("mailFail");
    btn.disabled = false; if (tsWidget !== null && window.turnstile) try { window.turnstile.reset(tsWidget); } catch (e) {}
  }
}
function inviteUrl(){
  const base = CONFIG.shareUrl || location.href.split("#")[0].split("?")[0];
  const q = new URLSearchParams({ utm_source: "invite", utm_medium: "referral", utm_campaign: "iso9001-2026" });
  return base + "?" + q.toString();
}

/* ===================== PDF (pdfmake) ===================== */
let pdfLibPromise = null;
function loadPdfLib(){
  if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve();
  if (pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = CONFIG.pdfLib.reduce((p, src) => p.then(() => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); })), Promise.resolve())
    .catch(e => { pdfLibPromise = null; throw e; });
  return pdfLibPromise;
}
const PC = { wine: "#7D2142", deep: "#541029", rose: "#B65A76", blush: "#F5E4EA", blush2: "#EBCBD6", ink: "#26161C", ink2: "#5F4951", ink3: "#86707A", rule: "#E7D8DE",
  st: [["#F3D3DC","#7D2142"],["#FBEBD9","#80520E"],["#DDEFE7","#2B6553"]] };
function pdfTable(widths, head, body, extra){
  return { table: { headerRows: 1, dontBreakRows: true, keepWithHeaderRows: 1, widths, body: [head.map(h => typeof h === "string" ? { text: h, style: "th" } : { style: "th", ...h }), ...body] }, layout: {
    fillColor: (i) => i === 0 ? PC.wine : (i % 2 === 0 ? "#FBF5F7" : null), hLineWidth: (i, node) => i === 0 || i === node.table.body.length ? 0 : 0.5, vLineWidth: () => 0,
    hLineColor: () => PC.rule, paddingLeft: () => 6, paddingRight: () => 6, paddingTop: () => 5, paddingBottom: () => 5, ...(extra || {}) } };
}
const pill = (txt, lv) => ({ text: txt, bold: true, color: PC.st[lv][1], fillColor: PC.st[lv][0], fontSize: 8.5 });
function buildDoc(){
  const sc = scoreAll(), g = gapAnalysis(), p = state.profile, company = p.company || T("yourOrg");
  const dateTxt = new Intl.DateTimeFormat("en-GB", { dateStyle: "long" }).format(new Date());
  const meta = [L(OPTS.industry)[p.industry], (L(OPTS.size)[p.size] || "") + " " + T("employees"), L(OPTS.cert)[p.cert]].filter(Boolean).join("  |  ");
  const [vh, vb] = T("quad")[sc.quad];
  const mtx = matrixSVG(sc, { plot: PC.blush, hi: PC.blush2, sep: "#FFFFFF", dot: PC.wine, ring: "#FFFFFF", ink2: PC.ink2, ink3: PC.ink3, font: "Roboto" });
  const hb = s => harvey(s, { line: PC.wine, fill: PC.wine, bg: "#FFFFFF" });
  const exTitle = (n, t) => ({ text: [{ text: T("ex") + " " + n + "   ", color: PC.wine, bold: true }, { text: t, color: PC.ink }], style: "exh", headlineLevel: 1 });
  const content = [
    { text: "Bimser QDMS", color: "#FFFFFF", bold: true, fontSize: 11, margin: [0, 0, 0, 40] },
    { text: T("reportTitle"), color: "#F2D3DD", fontSize: 12 },
    { text: company, color: "#FFFFFF", fontSize: 26, bold: true, margin: [0, 4, 0, 6] },
    { text: dateTxt + "   |   " + meta, color: "#F2D3DD", fontSize: 9.5, margin: [0, 0, 0, 58] },
    { columns: [
      { width: "*", stack: [
        { columns: [{ stack: [{ text: String(sc.readiness), fontSize: 30, bold: true, color: PC.wine }, { text: T("readiness") + ", " + T("of100"), fontSize: 8.5, color: PC.ink2 }] },
                    { stack: [{ text: String(sc.digital), fontSize: 30, bold: true, color: PC.wine }, { text: T("digital") + ", " + T("of100"), fontSize: 8.5, color: PC.ink2 }] }], margin: [0, 0, 0, 8] },
        { svg: mtx, width: 250 },
        { table: { widths: ["*"], body: [[{ stack: [{ text: vh, bold: true, fontSize: 12, color: PC.deep }, { text: vb, color: PC.ink2, margin: [0, 3, 0, 0] }], fillColor: PC.blush, margin: [6, 6, 6, 6] }]] }, layout: "noBorders", margin: [0, 6, 0, 0] } ] },
      { width: 230, stack: [
        { text: T("ex2"), bold: true, color: PC.wine, margin: [0, 0, 0, 6] },
        { table: { widths: [18, "*", 24], body: AREAS.map(a => [{ svg: hb(sc.area[a.id]), width: 12 }, { text: [L(a.name), { text: "\n" + areaClause(a), fontSize: 7.5, color: PC.ink3 }] }, { text: String(sc.area[a.id]), bold: true, alignment: "right" }]) },
          layout: { hLineWidth: (i) => i === 0 ? 0 : 0.5, vLineWidth: () => 0, hLineColor: () => PC.rule, paddingTop: () => 5, paddingBottom: () => 5 } },
        { text: T("summaryTitle"), bold: true, color: PC.wine, margin: [0, 14, 0, 6] },
        { table: { widths: [28, "*"], body: [[g.major, T("sumMajor")], [g.partial, T("sumPartial")], [g.digNeed, T("sumDigital")], [g.mods.length, T("sumModules")]].map(r => [{ text: String(r[0]), bold: true, fontSize: 14, color: PC.wine }, { text: r[1], margin: [0, 3, 0, 0] }]) }, layout: "noBorders" } ] }
    ], columnGap: 24 },
    { text: "", pageBreak: "after" },
    exTitle(3, T("ex3")),
    pdfTable([60, 140, "*"], [T("thClause"), T("thWhat"), T("thMeans")], CHANGES_2026.map(c => [{ text: c.clause, bold: true, color: PC.wine }, { text: L(c.what), bold: true }, L(c.means)])),
    { text: " ", margin: [0, 6] },
    exTitle(4, T("ex4")),
    pdfTable([42, 120, 30, 62, "*"], [T("thClause"), T("thTopic"), T("thScore"), T("thStatus"), T("thRevise")],
      g.rows.map(r => [{ text: clauseTxt(r.clause), bold: true, color: PC.wine }, { text: [{ text: L(r.topic), bold: true }, { text: "\n" + L(r.change), fontSize: 7.5, color: PC.ink3 }] }, { text: String(r.score), alignment: "right", bold: true }, pill(T("gap")[r.level], r.level), r.level < 2 ? L(r.revise) : { text: T("keep"), color: PC.ink3 }])),
    { text: " ", margin: [0, 6] },
    exTitle(5, T("ex5")),
    sc.digital < 60 ? { text: T("pdfDigitalRec"), color: PC.ink2, margin: [0, 0, 0, 8] } : "",
    pdfTable([130, 95, 60, "*"], [T("thProcess"), T("thToday"), T("thNeed"), T("thModule")],
      g.dig.map(d => [{ text: [L(d.t), { text: "\n" + d.clause, fontSize: 7.5, color: PC.ink3 }] }, L(SCALE_B)[d.tool], pill(T("need")[d.need], d.need), d.mods.map(m => L(MODULES[m].name)).join("\n")])),
    { text: " ", margin: [0, 6] },
    { ...exTitle(6, T("ex6")), pageBreak: "before" },
    (() => { const rm = roadmap(g), dot = '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="' + PC.wine + '"/></svg>';
      const bar = p => ({ canvas: [{ type: "rect", x: 0, y: 3, w: 46, h: 6, r: 3, color: PC.blush2 }, { type: "rect", x: 0, y: 3, w: Math.max(6, 46 * p), h: 6, r: 3, color: PC.wine }] });
      return pdfTable([150, 44, ...rm.cols.map(() => "*")], [T("thModule"), T("thPriority"), ...rm.cols.map(c => ({ text: colLabel(c), alignment: "center", fontSize: 7 }))],
        rm.rows.map(r => [{ stack: [{ text: L(MODULES[r.id].name), bold: true }, { text: L(MODULES[r.id].why), fontSize: 7, color: PC.ink3, margin: [0, 2, 0, 0] }] }, bar(r.pct),
          ...rm.cols.map(c => r.has.has(c) ? { svg: dot, width: 8, alignment: "center", margin: [0, 2, 0, 0] } : "")]),
        { vLineWidth: (i, node) => i > 2 && i < node.table.widths.length ? 0.5 : 0, vLineColor: () => PC.blush2,
          paddingLeft: (i) => i > 1 ? 1 : 6, paddingRight: (i) => i > 1 ? 1 : 6 }); })(),
    { text: T("rmNote"), fontSize: 7.5, color: PC.ink3, margin: [0, 6, 0, 0] },
    g.more.length ? { text: [{ text: T("moreMods") + ": ", bold: true }, g.more.map(m => L(MODULES[m].name)).join(", ")], color: PC.ink2, margin: [0, 8, 0, 0] } : "",
    { unbreakable: true, stack: [
      { text: T("pdfNext"), style: "exh", margin: [0, 18, 0, 6] },
      { text: T("pdfNextBody"), color: PC.ink2 },
      { text: [{ text: T("book") + ": ", bold: true }, { text: CONFIG.bookingUrl, link: CONFIG.bookingUrl, color: PC.wine }], margin: [0, 6, 0, 0] },
      { text: T("disclaimer") + " " + T("isoNote"), fontSize: 7.5, color: PC.ink3, margin: [0, 18, 0, 0] } ] }
  ];
  return {
    pageSize: "A4", pageMargins: [44, 52, 44, 50],
    info: { title: T("reportTitle") + " – " + company, author: "Bimser QDMS", subject: "ISO 9001:2026" },
    background: (page) => page === 1 ? { canvas: [{ type: "rect", x: 0, y: 0, w: 595.28, h: 232, linearGradient: ["#5C1430", "#A2466A"] }] } : null,
    header: (page) => page === 1 ? null : { columns: [{ text: "Bimser QDMS  |  " + T("tool"), color: PC.ink3 }, { text: company, alignment: "right", color: PC.ink3 }], margin: [44, 22, 44, 0], fontSize: 7.5 },
    footer: (cur, total) => ({ columns: [{ text: T("pdfPrepared"), color: PC.ink3 }, { text: T("pdfPage") + " " + cur + " / " + total, alignment: "right", color: PC.ink3 }], margin: [44, 18, 44, 0], fontSize: 7.5 }),
    content,
    pageBreakBefore: (node, after) => node.headlineLevel === 1 && after.length < 6,
    styles: { th: { bold: true, color: "#FFFFFF", fontSize: 8.5 }, exh: { fontSize: 13, margin: [0, 0, 0, 8] } },
    defaultStyle: { font: "Roboto", fontSize: 9, color: PC.ink, lineHeight: 1.2 }
  };
}
function pdfName(){ const c = (state.profile.company || "").normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 40); return T("pdfFile") + (c ? "-" + c : "") + "-" + new Date().toISOString().slice(0,10) + ".pdf"; }
async function makePdf(auto){
  const btn = document.getElementById("pdfBtn"); if (btn) btn.disabled = true; setPdfMsg(T("pdfMaking"));
  try { await loadPdfLib(); window.pdfMake.createPdf(buildDoc()).download(pdfName()); state.pdfDone = true; setPdfMsg(T("pdfDownloaded")); }
  catch (e) { console.warn("[ISO26] pdf", e); setPdfMsg(auto ? T("pdfReady") : T("pdfFail")); }
  if (btn) btn.disabled = false;
}

/* ===================== ROUTER ===================== */
function toast(m){ const el = document.getElementById("toast"); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
function go(step){ state.step = step; render(); window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
function render(){
  document.documentElement.lang = state.lang;
  document.getElementById("fDisc").textContent = T("disclaimer"); document.getElementById("fIso").textContent = T("isoNote");
  if (state.step === "intro") renderIntro();
  else if (state.step === "profile") renderProfile();
  else if (AREA_STEPS.includes(state.step)) renderArea(state.step);
  else if (state.step === "digital") renderDigital();
  else if (state.step === "report") renderReport();
}
render();
